<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>{{title}}</title>
<style>
  :root { --muted:#6b7280; --text:#111827; --border:#e5e7eb; }
  body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; color: var(--text); margin: 24px; }
  h1 { margin: 0 0 6px 0; font-size: 56px; }
  .sub { color: var(--muted); margin-bottom: 48px; }
  .grid { display: flex; flex-direction: column; gap: 36px; font-size: 24px;}
  .item { display: grid; grid-template-columns: 160px 1fr; gap: 12px; align-items: baseline; }
  .label { color: var(--muted); }
  .value { border-bottom: 1px solid var(--border); padding-bottom: 20px; }
  .multiline { white-space: pre-wrap; }
  .footer { margin-top: 16px; color: var(--muted); font-size: 18px; }
  @media print { body { margin: 12mm; } }
</style>
</head>
<body>
  <h1>Persönliche Details</h1>
  <div class="sub">Generiert {{generated}}</div>
  <div class="grid">{{rows}}</div>
  {{shareUrl}}
  <script>
    setTimeout(function(){ window.print(); }, 50);
  </script>
</body>
</html>
