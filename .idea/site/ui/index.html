<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Persönliche Details</title>
    <style>
        :root {
            --bg: #f7fafc;
            --panel: #ffffff;
            --muted: #6b7280;
            --text: #111827;
            --accent: #2563eb;
            --accent-2: #059669;
            --danger: #dc2626;
            --border: #e5e7eb;
        }

        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
            color: var(--text);
            background: var(--bg);
        }

        .wrap {
            max-width: 820px;
            margin: 32px auto 60px auto;
            padding: 16px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.06);
            padding: 26px;
        }

        h1 {
            margin: 0 0 6px 0;
            font-size: 24px;
            letter-spacing: 0.2px;
        }

        p.sub {
            margin: 0 0 22px 0;
            color: var(--muted);
            font-size: 14px;
        }

        form {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 18px 16px;
        }

        .field {
            grid-column: span 12;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Two-column layout on wider screens */
        @media (min-width: 720px) {
            .col-6 {
                grid-column: span 6;
            }

            .col-4 {
                grid-column: span 4;
            }

            .col-8 {
                grid-column: span 8;
            }

            .col-3 {
                grid-column: span 3;
            }

            .col-9 {
                grid-column: span 9;
            }
        }

        label {
            font-size: 13px;
            color: var(--muted);
        }

        input, textarea, select, button {
            font: inherit;
            color: var(--text);
        }

        input, textarea, select {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            outline: none;
            transition: border-color .15s ease, box-shadow .15s ease;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .row {
            display: contents;
        }

        .actions {
            grid-column: span 12;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 6px;
        }

        .btn {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 14px;
            background: linear-gradient(180deg, rgba(37, 99, 235, 0.10), rgba(37, 99, 235, 0.06));
            color: #0b1a37;
            cursor: pointer;
            transition: transform .06s ease, filter .15s ease, background .2s ease;
        }

        .btn:hover {
            filter: brightness(1.03);
        }

        .btn:active {
            transform: translateY(1px) scale(0.995);
        }

        .btn.secondary {
            background: linear-gradient(180deg, rgba(107, 114, 128, 0.12), rgba(107, 114, 128, 0.08));
        }

        .btn.success {
            background: linear-gradient(180deg, rgba(5, 150, 105, 0.12), rgba(5, 150, 105, 0.08));
        }

        small.help {
            color: var(--muted);
        }

        .status {
            min-height: 1.2em;
            color: var(--accent-2);
            font-size: 13px;
        }

        .status.error {
            color: var(--danger);
        }

        .url-preview {
            grid-column: span 12;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 12px;
            color: #111827;
            background: #f3f4f6;
            border: 1px dashed #d1d5db;
            border-radius: 10px;
            padding: 10px 12px;
            word-break: break-all;
            user-select: all;
        }

        footer {
            margin-top: 16px;
            color: var(--muted);
            font-size: 12px;
            text-align: center;
        }

        a {
            color: #1d4ed8;
        }

        /* Print summary styles (used in PDF export) */
        @media print {
            body {
                background: #ffffff;
                color: #111827;
            }
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <h1>Persönliche Details</h1>
        <p class="sub">Bitte füllen Sie Ihre persönlichen Daten ein, kopieren Sie den Link um Ihre Daten zu
            versenden.</p>

        <form id="person-form" novalidate>
            <div class="row">
                <div class="field col-6">
                    <label for="firstName">Vorname *</label>
                    <input id="firstName" name="firstName" type="text" required placeholder="John"/>
                </div>
                <div class="field col-6">
                    <label for="lastName">Nachname *</label>
                    <input id="lastName" name="lastName" type="text" required placeholder="Doe"/>
                </div>
            </div>

            <div class="row">
                <div class="field">
                    <label for="email">E-Mail *</label>
                    <input id="email" name="email" type="email" required inputmode="email"
                           placeholder="john.doe@gmail.com"/>
                </div>
            </div>

            <div class="row">
                <div class="field col-8">
                    <label for="birthDate">Geburtsdatum *</label>
                    <input id="birthDate" name="birthDate" type="date" required/>
                </div>
                <div class="field col-4">
                    <label for="age">Alter</label>
                    <input id="age" name="age" type="number" min="0" max="150" required placeholder="30" readonly/>
                </div>
            </div>

            <div class="row">
                <div class="field">
                    <label for="phone">Tel.Nr.</label>
                    <input id="phone" name="phone" type="tel" inputmode="tel" placeholder="+15 555 123 4567"/>
                </div>
            </div>

            <div class="field">
                <label for="notes">Notizen</label>
                <textarea id="notes" name="notes" rows="4" placeholder="Anmerkungen..."></textarea>
            </div>

            <!--            <div class="url-preview" id="urlPreview" aria-live="polite"></div>-->

            <div class="actions">
                <button type="button" class="btn" id="copyBtn">Versenden / Link kopieren</button>
                <button type="button" class="btn secondary" id="downloadPdfBtn">PDF herunterladen</button>
                <button type="reset" class="btn secondary" id="resetBtn">Zurücksetzen</button>
                <div class="status" id="statusMsg" role="status" aria-live="polite"></div>
            </div>
        </form>

        <footer>
            Programmiert von Samuel Bauer
        </footer>
    </div>
</div>

<script>
    (function () {
        const form = document.getElementById('person-form');
        const urlPreview = document.getElementById('urlPreview');
        const statusMsg = document.getElementById('statusMsg');
        const copyBtn = document.getElementById('copyBtn');
        const mdBtn = document.getElementById('downloadMdBtn');
        const pdfBtn = document.getElementById('downloadPdfBtn');
        const birthInput = document.getElementById('birthDate');
        const ageInput = document.getElementById('age');

        function calculateAgeFromDateString(isoDate) {
            if (!isoDate) return '';
            const today = new Date();
            const [y, m, d] = isoDate.split('-').map(Number);
            if (!y || !m || !d) return '';
            let age = today.getFullYear() - y;
            const monthDiff = (today.getMonth() + 1) - m;
            const dayDiff = today.getDate() - d;
            if (monthDiff < 0 || (monthDiff === 0 && dayDiff < 0)) {
                age--;
            }
            if (age < 0 || age > 150) return '';
            return String(age);
        }

        function updateAge() {
            if (!birthInput || !ageInput) return;
            const val = calculateAgeFromDateString(birthInput.value);
            ageInput.value = val;
        }

        // Collect form data into a plain object (only non-empty)
        function getFormData() {
            const data = {};
            const elements = form.elements;
            for (let i = 0; i < elements.length; i++) {
                const el = elements[i];
                if (!el.name) continue;
                if ((el.type === 'checkbox' || el.type === 'radio')) {
                    if (!el.checked) continue;
                }
                const value = (el.value || '').trim();
                if (value !== '') {
                    data[el.name] = value;
                }
            }
            return data;
        }

        // Map field labels for nicer output
        const LABELS = {
            firstName: 'Vorname',
            lastName: 'Nachname',
            email: 'E-Mail',
            age: 'Alter',
            birthDate: 'Geburtsdatum',
            phone: 'Tel.Nr.',
            notes: 'Notizen'
        };

        function getNowLocalString() {
            const d = new Date();
            const pad = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        // Date string for filenames (YYYY-MM-DD)
        function getDateOnlyString() {
            const d = new Date();
            const pad = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        }

        // Build a shareable URL with query params for non-empty values
        function buildShareUrl(data = getFormData()) {
            const url = new URL(window.location.href);
            url.search = '';
            const params = new URLSearchParams();
            Object.keys(data).forEach(k => {
                params.set(k, data[k]);
            });
            url.search = params.toString();
            return url.toString();
        }

        // Populate form from URLSearchParams
        function populateFromUrl() {
            const params = new URLSearchParams(window.location.search);
            if (params.size === 0) return;
            const elements = form.elements;
            for (let i = 0; i < elements.length; i++) {
                const el = elements[i];
                if (!el.name) continue;
                if (params.has(el.name)) {
                    const v = params.get(el.name);
                    el.value = v;
                    if (el.type === 'checkbox') {
                        el.checked = v === 'true' || v === 'on' || v === '1';
                    }
                }
            }
        }

        // Clipboard helper with fallback
        async function copyToClipboard(text) {
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }
            } catch (_) { /* fall through to fallback */
            }

            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                const ok = document.execCommand('copy');
                document.body.removeChild(ta);
                return ok;
            } catch (e) {
                return false;
            }
        }

        function updatePreview() {
            const url = buildShareUrl();
            urlPreview.textContent = url;
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Prevent multiple print/download triggers
        let isPrinting = false;
        function openPrintViewAndPrint() {
            // Validate
            if (!form.checkValidity()) {
                const firstInvalid = form.querySelector(':invalid');
                if (firstInvalid) firstInvalid.focus();
                statusMsg.textContent = 'Bitte die Pflichtfelder ausfüllen.';
                statusMsg.classList.add('error');
                return;
            }
            if (isPrinting) return; // already in progress
            isPrinting = true;
            if (pdfBtn) pdfBtn.disabled = true;
            statusMsg.textContent = 'PDF wird vorbereitet…';
            statusMsg.classList.remove('error');

            const data = getFormData();
            const rows = Object.keys(LABELS).filter(k => k in data).map(key => {
                const safe = ('' + data[key]).replace(/&/g, '&amp;').replace(/</g, '&lt;');
                if (key === 'notes') {
                    const para = safe.replace(/\n/g, '<br/>');
                    return `<div class=\"item\"><div class=\"label\">${LABELS[key]}</div><div class=\"value multiline\">${para}</div></div>`;
                }
                return `<div class=\"item\"><div class=\"label\">${LABELS[key]}</div><div class=\"value\">${safe}</div></div>`;
            }).join('');

            const shareUrl = buildShareUrl(data);
            const generated = getNowLocalString();
            const dateOnly = getDateOnlyString();
            const shareUrlHtml = shareUrl
                ? `<div class="footer">URL teilen:<br/><a href="${shareUrl}">${escapeHtml(shareUrl)}</a></div>` : '';

            fetch('pdf-template.html')
                .then(response => response.text())
                .then(template => {
                    const title = `${dateOnly} ${data.firstName || ''} ${data.lastName || ''}`.trim();
                    const tabTitle = `${dateOnly} ${data.lastName || ''} ${data.firstName || ''}`.trim();
                    try { document.title = tabTitle; } catch (_) {}
                    let html = template
                        .replaceAll('{{title}}', title)
                        .replaceAll('{{generated}}', generated)
                        .replaceAll('{{rows}}', rows)
                        .replaceAll('{{shareUrl}}', shareUrlHtml);

                    // Create hidden iframe (no new window)
                    const iframe = document.createElement('iframe');
                    iframe.style.position = 'fixed';
                    iframe.style.right = '0';
                    iframe.style.bottom = '0';
                    iframe.style.width = '0';
                    iframe.style.height = '0';
                    iframe.style.border = '0';
                    iframe.setAttribute('aria-hidden', 'true');
                    document.body.appendChild(iframe);

                    const doc = iframe.contentDocument || iframe.contentWindow.document;
                    doc.open();
                    doc.write(html);
                    doc.close();

                    // Explicitly set the print document title to influence the default PDF filename
                    try {
                        doc.title = title;
                    } catch (_) {}

                    // The template will call window.print() on load (inside the iframe)
                    // Cleanup after a short delay
                    setTimeout(() => {
                        try { document.body.removeChild(iframe); } catch (_) {}
                        isPrinting = false;
                        if (pdfBtn) pdfBtn.disabled = false;
                        statusMsg.textContent = 'PDF-Dialog geöffnet.';
                    }, 4000);
                })
                .catch(() => {
                    isPrinting = false;
                    if (pdfBtn) pdfBtn.disabled = false;
                    statusMsg.textContent = 'PDF-Vorlage konnte nicht geladen werden.';
                    statusMsg.classList.add('error');
                });
        }

        // Live preview on input
        form.addEventListener('input', updatePreview);
        if (birthInput) {
            birthInput.addEventListener('input', function () {
                updateAge();
                updatePreview();
            });
            birthInput.addEventListener('change', function () {
                updateAge();
                updatePreview();
            });
        }

        // Copy button behavior: validate, then copy URL
        copyBtn.addEventListener('click', async () => {
            statusMsg.textContent = '';
            statusMsg.classList.remove('error');

            if (!form.checkValidity()) {
                const firstInvalid = form.querySelector(':invalid');
                if (firstInvalid) firstInvalid.focus();
                statusMsg.textContent = 'Bitte die benötigten Pflichtfelder ausfüllen.';
                statusMsg.classList.add('error');
                return;
            }

            const shareUrl = buildShareUrl();
            const ok = await copyToClipboard(shareUrl);
            if (ok) {
                statusMsg.textContent = 'Link kopiert!';
                statusMsg.classList.remove('error');
            } else {
                statusMsg.textContent = 'Link konnte nicht kopiert werden. Bitte alle Felder ausfüllen.';
                statusMsg.classList.add('error');
            }
            updatePreview();
        });

        pdfBtn.addEventListener('click', openPrintViewAndPrint);
        // Reset status and preview on form reset
        document.getElementById('resetBtn').addEventListener('click', () => {
            setTimeout(() => { // wait for actual reset to apply
                statusMsg.textContent = '';
                statusMsg.classList.remove('error');
                updatePreview();
            });
        });

        // Initialize
        populateFromUrl();
        updateAge();
        updatePreview();
    })();
</script>
</body>
</html>
